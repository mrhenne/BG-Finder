    // HILFSFUNKTION FÜR UNSCHARFE SUCHE (Levenshtein-Distanz)
    function getLevenshteinDistance(a, b) {
      if (a.length === 0) return b.length;
      if (b.length === 0) return a.length;
      const matrix = [];
      for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
      for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

      { title: "Busfahrer (Privates Unternehmen)", category: "Transport", bg: "BGVERKEHR", keywords: ["reisebus", "linienbus", "öpnv", "verkehr"] },
      { title: "Taxifahrer", category: "Transport", bg: "BGVERKEHR", keywords: ["taxi", "personenbeförderung", "auto", "chauffeur"] },
      { title: "Müllwerker (Private Entsorgung)", category: "Dienstleistung", bg: "BGVERKEHR", keywords: ["müll", "abfall", "entsorgung", "remondis", "tonne"] },
      { title: "Pilot / Flugbegleiter", category: "Transport", bg: "BGVERKEHR", keywords: ["flugzeug", "fliegen", "stewardess", "airport", "flughafen"] },
      { title: "Seemann / Matrose", category: "Transport", bg: "BGVERKEHR", keywords: ["schiff", "meer", "wasser", "hafen", "frachtschiff"] },
      { title: "Lokführer (Deutsche Bahn)", category: "Transport", bg: "UK_BUND", keywords: ["bahn", "zug", "gleise", "eisenbahn", "db", "triebfahrzeugführer"] },

      // Gastronomie & Nahrungsmittel
      { title: "Koch / Köchin", category: "Gastronomie", bg: "BGN", keywords: ["küche", "restaurant", "essen", "kochen", "herd", "chefkoch"] },
      { title: "Restaurantfachmann / Kellner", category: "Gastronomie", bg: "BGN", keywords: ["bedienung", "gastro", "service", "bar", "tresen", "tablett"] },
      { title: "Hotelfachmann", category: "Gastronomie", bg: "BGN", keywords: ["hotel", "rezeption", "gastgewerbe", "tourismus", "checkin"] },
      { title: "Bäcker / Konditor", category: "Handwerk", bg: "BGN", keywords: ["brot", "brötchen", "backen", "teig", "kuchen", "torte"] },
      { title: "Fleischer / Metzger", category: "Handwerk", bg: "BGN", keywords: ["fleisch", "wurst", "schlachter", "messer", "theke"] },
      { title: "Brauer", category: "Industrie", bg: "BGN", keywords: ["bier", "brauerei", "hopfen", "malz", "getränke"] },
      { title: "Fachkraft für Lebensmitteltechnik", category: "Industrie", bg: "BGN", keywords: ["produktion", "lebensmittel", "fabrik", "essen"] },

      // Landwirtschaft, Forsten & Gartenbau
      { title: "Landwirt / Bauer", category: "Natur", bg: "SVLFG", keywords: ["bauernhof", "traktor", "tiere", "feld", "ernte", "agrar", "schwein", "kuh"] },
      { title: "Gärtner / Landschaftsbauer", category: "Natur", bg: "SVLFG", keywords: ["garten", "pflanzen", "blumen", "bäume", "rasen", "erde", "galabau"] },
      { title: "Forstwirt / Waldarbeiter", category: "Natur", bg: "SVLFG", keywords: ["wald", "holzfäller", "kettensäge", "bäume", "forst"] },
      { title: "Florist", category: "Handel", bg: "SVLFG", keywords: ["blumen", "strauß", "pflanzen", "dekoration", "binden"] },
      { title: "Winzer", category: "Natur", bg: "SVLFG", keywords: ["wein", "reben", "weingut", "alkohol", "trauben"] },

      // Rohstoffe & Chemie
      { title: "Chemikant", category: "Industrie", bg: "BGRCI", keywords: ["chemie", "labor", "mischen", "rohstoffe", "produktion", "reaktor"] },
      { title: "Chemielaborant", category: "Industrie", bg: "BGRCI", keywords: ["labor", "analyse", "proben", "reagenzglas", "forschung"] },
      { title: "Bergmann", category: "Industrie", bg: "BGRCI", keywords: ["tagebau", "untertage", "kohle", "mine", "bagger", "rohstoffe"] },
      { title: "Papiertechnologe", category: "Industrie", bg: "BGRCI", keywords: ["papier", "karton", "pappe", "produktion", "fabrik"] },
      { title: "Baustoffprüfer", category: "Industrie", bg: "BGRCI", keywords: ["beton", "asphalt", "labor", "prüfung", "steine"] }
    ];

    function App() {
      const [searchTerm, setSearchTerm] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("Alle");
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [copiedPhone, setCopiedPhone] = useState(null);
      const [searchHistory, setSearchHistory] = useState([]);

      // Theme Initialisierung
      useEffect(() => {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          setIsDarkMode(true);
        }
      }, []);

      // HTML Class umschalten für Tailwind Dark Mode
      useEffect(() => {
        if (isDarkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [isDarkMode]);

      // Verlauf aus dem Local Storage laden
      useEffect(() => {
        const savedHistory = localStorage.getItem('bgFinderHistory');
        if (savedHistory) {
          try {
            setSearchHistory(JSON.parse(savedHistory));
          } catch (e) {
            console.error("Fehler beim Laden des Verlaufs", e);
          }
        }
      }, []);

      // Verlauf automatisch speichern (Debounce-Logik)
      useEffect(() => {
        const term = searchTerm.trim();
        if (term.length < 3) return;

        const timer = setTimeout(() => {
          setSearchHistory(prevHistory => {
            const filteredHistory = prevHistory.filter(t => t.toLowerCase() !== term.toLowerCase());
            const newHistory = [term, ...filteredHistory].slice(0, 10);
            localStorage.setItem('bgFinderHistory', JSON.stringify(newHistory));
            return newHistory;
          });
        }, 1500);

        return () => clearTimeout(timer);
      }, [searchTerm]);

      const clearHistory = () => {
        setSearchHistory([]);
        localStorage.removeItem('bgFinderHistory');
      };

      const categories = useMemo(() => {
        const cats = new Set(professionsDatabase.map(p => p.category));
        return ["Alle", ...Array.from(cats).sort()];
      }, []);

      const searchResults = useMemo(() => {
        const searchLower = searchTerm.trim().toLowerCase();
        
        if (!searchLower) {
          return {
            exact: professionsDatabase
              .filter(p => selectedCategory === "Alle" || p.category === selectedCategory)
              .sort((a, b) => a.title.localeCompare(b.title)),
            fuzzy: [],
            fallback: false
          };
        }

        const exactMatches = [];
        const fuzzyMatches = [];
        const searchWords = searchLower.split(/\s+/).filter(w => w.length > 0);

        professionsDatabase.forEach(prof => {
          if (selectedCategory !== "Alle" && prof.category !== selectedCategory) return;

          let isExact = false;
          
          if (
            prof.title.toLowerCase().includes(searchLower) ||
            prof.bg.toLowerCase().includes(searchLower) ||
            prof.category.toLowerCase().includes(searchLower) ||
            prof.keywords.some(kw => kw.toLowerCase().includes(searchLower) || searchLower.includes(kw.toLowerCase()))
          ) {
            isExact = true;
            exactMatches.push(prof);
          }

          if (!isExact && searchLower.length > 2) {
            let bestDistance = Infinity;
            const profWords = [
              ...prof.title.toLowerCase().split(/[\s/()]+/), 
              ...prof.keywords.map(k => k.toLowerCase()),
              prof.category.toLowerCase()
            ].filter(w => w.length > 2);

            searchWords.forEach(sWord => {
              const threshold = sWord.length <= 4 ? 1 : 2;
              profWords.forEach(pWord => {
                const dist = getLevenshteinDistance(sWord, pWord);
                if (dist <= threshold && dist < bestDistance) {
                  bestDistance = dist;
                }
              });
            });

            if (bestDistance !== Infinity) {
              fuzzyMatches.push({ prof, distance: bestDistance });
            }
          }
        });

        const sortedFuzzy = fuzzyMatches
          .sort((a, b) => a.distance - b.distance)
          .map(item => item.prof)
          .slice(0, 5); 

        const isFallback = exactMatches.length === 0 && sortedFuzzy.length === 0;

        return {
          exact: exactMatches.sort((a, b) => a.title.localeCompare(b.title)),
          fuzzy: sortedFuzzy,
          fallback: isFallback
        };
      }, [searchTerm, selectedCategory]);

      const toggleTheme = () => setIsDarkMode(!isDarkMode);

      const copyToClipboard = (text, type) => {
        navigator.clipboard.writeText(text);
        setCopiedPhone(type);
        setTimeout(() => setCopiedPhone(null), 2000);
      };

      const handlePrint = () => {
        window.print();
      };

      const ProfessionCard = ({ prof, isSuggestion }) => {
        const bgInfo = bgData[prof.bg];
        return (
          <div className={`p-5 rounded-3xl border transition-all duration-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4 
            ${isDarkMode 
              ? 'bg-slate-800 border-slate-700 hover:border-slate-500 shadow-slate-900' 
              : 'bg-white border-gray-200 hover:shadow-md'
            } ${isSuggestion ? 'opacity-90 border-dashed' : ''}`}
          >
            <div>
              <h3 className={`text-xl font-bold ${isDarkMode ? 'text-white' : 'text-gray-900'} flex items-center gap-2`}>
                {prof.title}
                {isSuggestion && <Icon name="Sparkles" className="w-4 h-4 text-blue-500" />}
              </h3>
              <div className="flex flex-wrap items-center gap-2 mt-2">
                <span className={`text-xs font-semibold px-2.5 py-1 rounded-lg ${isDarkMode ? 'bg-slate-700 text-slate-200' : 'bg-gray-100 text-gray-700'}`}>
                  {prof.category}
                </span>
                <span className={`text-xs truncate max-w-[200px] sm:max-w-xs hidden md:inline-block ${isDarkMode ? 'text-slate-500' : 'text-gray-400'}`}>
                   Keywords: {prof.keywords.slice(0, 3).join(', ')}
                </span>
              </div>
            </div>
            
            <div className={`flex flex-col sm:items-end min-w-[200px] p-3 rounded-2xl border ${bgInfo.color}`}>
              <span className="font-extrabold text-lg flex items-center gap-1.5">
                {bgInfo.short}
              </span>
              <span className="text-xs font-semibold mt-1 opacity-90 leading-tight sm:text-right">
                {bgInfo.name}
              </span>
            </div>
          </div>
        );
      };

      return (
        <div className={`min-h-screen p-4 md:p-8 font-sans`}>
          <div className="max-w-6xl mx-auto space-y-8">
            
            {/* Header (Wird beim Drucken ausgeblendet) */}
            <header className={`print:hidden flex flex-col md:flex-row justify-between items-start md:items-center gap-4 p-6 rounded-3xl shadow-sm border 
              ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}
            >
              <div>
                <h1 className="text-3xl font-extrabold tracking-tight flex items-center gap-3">
                  <Icon name="ShieldAlert" className="w-8 h-8 text-blue-600 dark:text-blue-500" />
                  <span className={isDarkMode ? 'text-white' : 'text-gray-900'}>BG Finder Pro</span>
                </h1>
                <p className={`mt-1 font-medium ${isDarkMode ? 'text-slate-400' : 'text-gray-500'}`}>
                  Smarte Zuordnung von Berufen & Branchen zur zuständigen Unfallkasse/BG.
                </p>
              </div>
              <button 
                onClick={toggleTheme}
                className={`p-3 rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500
                  ${isDarkMode ? 'bg-slate-800 hover:bg-slate-700 text-yellow-500' : 'bg-gray-100 hover:bg-gray-200 text-slate-700'}`}
              >
                {isDarkMode ? <Icon name="Sun" className="w-5 h-5" /> : <Icon name="Moon" className="w-5 h-5" />}
              </button>
            </header>

            {/* Nur für den Ausdruck sichtbar */}
            <div className="hidden print:block mb-8 border-b-2 border-black pb-4">
              <h1 className="text-2xl font-bold text-black">Notfall-Information: Arbeitsunfall</h1>
              <p className="text-sm text-gray-600">Generiert via BG Finder Pro am {new Date().toLocaleDateString()}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
              
              <div className="lg:col-span-2 space-y-6 print:hidden">
                
                {/* Suchbereich */}
                <div className={`p-6 rounded-3xl shadow-sm border space-y-6 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                  <div className="relative">
                    <Icon name="Search" className={`absolute left-4 top-1/2 transform -translate-y-1/2 w-6 h-6 ${isDarkMode ? 'text-slate-500' : 'text-gray-400'}`} />
                    <input
                      type="text"
                      placeholder="Beruf, Branche oder Einrichtung (z.B. Schule, Pflege, Bau)..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className={`w-full pl-14 pr-4 py-4 rounded-2xl border-2 focus:outline-none transition-colors text-lg font-medium
                        ${isDarkMode 
                          ? 'bg-slate-950 border-slate-700 text-white focus:border-blue-500 placeholder-slate-600' 
                          : 'bg-gray-50 border-gray-200 text-gray-900 focus:border-blue-500 placeholder-gray-400'
                        }`}
                    />
                  </div>

                  {/* Verlauf Feature */}
                  {searchHistory.length > 0 && (
                    <div className="flex flex-wrap items-center gap-2 pt-2 border-t border-gray-100 dark:border-slate-800">
                      <span className={`text-sm font-bold flex items-center gap-1.5 ${isDarkMode ? 'text-slate-400' : 'text-gray-500'}`}>
                        <Icon name="History" className="w-4 h-4" /> Verlauf:
                      </span>
                      {searchHistory.map((term, index) => (
                        <button
                          key={index}
                          onClick={() => setSearchTerm(term)}
                          className={`text-xs px-3 py-1.5 rounded-full font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500
                            ${isDarkMode 
                              ? 'bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white' 
                              : 'bg-gray-100 text-gray-700 hover:bg-gray-200 hover:text-gray-900'
                            }`}
                        >
                          {term}
                        </button>
                      ))}
                      <button
                        onClick={clearHistory}
                        title="Verlauf löschen"
                        className={`p-1.5 ml-auto rounded-full transition-colors ${isDarkMode ? 'text-red-400 hover:bg-red-950/50' : 'text-red-500 hover:bg-red-50'}`}
                      >
                        <Icon name="Trash2" className="w-4 h-4" />
                      </button>
                    </div>
                  )}

                  {/* Kategorien */}
                  <div className="flex flex-wrap gap-2 pt-2">
                    {categories.map(cat => (
                      <button
                        key={cat}
                        onClick={() => setSelectedCategory(cat)}
                        className={`px-4 py-2 rounded-xl text-sm font-bold transition-all ${
                          selectedCategory === cat 
                            ? 'bg-blue-600 text-white shadow-md shadow-blue-500/30' 
                            : isDarkMode 
                              ? 'bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white' 
                              : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                        }`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Suchergebnisse */}
                <div className="space-y-6">
                  
                  {searchResults.exact.length > 0 && (
                    <div className="grid gap-4">
                      {searchResults.exact.map((prof, idx) => (
                        <ProfessionCard key={`exact-${idx}`} prof={prof} isSuggestion={false} />
                      ))}
                    </div>
                  )}

                  {searchTerm && searchResults.fuzzy.length > 0 && searchResults.exact.length === 0 && (
                    <div className="space-y-4">
                      <div className={`flex items-center gap-2 font-bold text-lg ${isDarkMode ? 'text-blue-400' : 'text-blue-600'}`}>
                        <Icon name="Sparkles" className="w-5 h-5" />
                        Meintest du eine dieser Richtungen?
                      </div>
                      <div className="grid gap-4">
                        {searchResults.fuzzy.map((prof, idx) => (
                          <ProfessionCard key={`fuzzy-${idx}`} prof={prof} isSuggestion={true} />
                        ))}
                      </div>
                    </div>
                  )}

                  {searchResults.fallback && (
                    <div className={`p-6 rounded-2xl border ${isDarkMode ? 'bg-orange-950/30 border-orange-900/50 text-orange-400' : 'bg-orange-50 border-orange-200 text-orange-800'}`}>
                      <p className="font-bold flex items-center gap-2 text-lg mb-2">
                        <Icon name="AlertCircle" className="w-6 h-6" />
                        Beruf nicht gefunden!
                      </p>
                      <p className="text-base">Dein gesuchter Begriff ist zu spezifisch. Versuche stattdessen nach der <strong>Branche</strong> oder <strong>Einrichtung</strong> zu suchen (z.B. "Bau", "Schule", "Büro", "Klinik").</p>
                    </div>
                  )}
                </div>
              </div>

              {/* Sidebar */}
              <div className="space-y-6 lg:col-span-1 col-span-1 w-full print:col-span-3 print:space-y-8">
                
                {/* Dynamische BG / UK Info */}
                {searchTerm && (searchResults.exact.length > 0 || searchResults.fuzzy.length > 0) && (
                  <div className="bg-blue-600 print:bg-white print:text-black print:border-2 print:border-black text-white p-6 rounded-3xl shadow-lg sticky top-8">
                    <div className="flex justify-between items-start mb-4">
                      <h3 className="font-bold text-lg flex items-center gap-2">
                        <Icon name="Info" className="w-5 h-5" /> 
                        Zuständige BG / UK
                      </h3>
                      <button onClick={handlePrint} className="print:hidden p-2 bg-blue-700 hover:bg-blue-800 rounded-lg transition-colors group">
                        <Icon name="Printer" className="w-5 h-5 text-blue-200 group-hover:text-white" />
                      </button>
                    </div>
                    <div className="space-y-4">
                      {(() => {
                        const topResult = searchResults.exact.length > 0 ? searchResults.exact[0] : searchResults.fuzzy[0];
                        const topBg = bgData[topResult.bg];
                        return (
                          <div className="space-y-3">
                            <div className="font-extrabold text-2xl print:text-3xl">{topBg.short}</div>
                            <p className="text-sm text-blue-100 print:text-black leading-relaxed font-medium">{topBg.description}</p>
                            
                            <div className="pt-4 border-t border-blue-500/50 print:border-black space-y-3">
                              <div className="flex items-center gap-3 text-sm bg-blue-700/50 print:bg-transparent p-3 rounded-xl w-full">
                                <Icon name="Phone" className="w-5 h-5 text-blue-300 print:text-black" />
                                <span className="font-mono font-bold flex-1 text-left text-base">{topBg.phone}</span>
                              </div>
                              
                              <div className="flex items-center gap-3 text-sm bg-blue-700/50 print:bg-transparent p-3 rounded-xl w-full">
                                <Icon name="ExternalLink" className="w-5 h-5 text-blue-300 print:text-black" />
                                <span className="font-bold flex-1 text-left truncate">{topBg.url.replace('https://www.', '')}</span>
                              </div>
                            </div>
                          </div>
                        );
                      })()}
                    </div>
                  </div>
                )}

                {/* Checkliste */}
                <div className={`p-6 rounded-3xl shadow-sm border print:shadow-none print:border-2 print:border-black print:bg-white print:text-black ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                  <h3 className={`font-bold text-lg mb-6 flex items-center gap-2 print:text-black ${isDarkMode ? 'text-red-400' : 'text-red-600'}`}>
                    <Icon name="ShieldAlert" className="w-6 h-6" />
                    Unfall Checkliste
                  </h3>
                  <ul className="space-y-5">
                    <li className="flex gap-3">
                      <Icon name="CheckCircle2" className={`w-5 h-5 flex-shrink-0 mt-0.5 print:text-black ${isDarkMode ? 'text-slate-500' : 'text-gray-400'}`} />
                      <div>
                        <span className={`font-bold text-sm block print:text-black ${isDarkMode ? 'text-white' : 'text-gray-900'}`}>1. Erste Hilfe</span>
                        <span className={`text-xs mt-1 block print:text-gray-800 ${isDarkMode ? 'text-slate-400' : 'text-gray-500'}`}>Ruhe bewahren, Unfallstelle sichern, Verletzten versorgen.</span>
                      </div>
                    </li>
                    <li className="flex gap-3">
                      <Icon name="CheckCircle2" className={`w-5 h-5 flex-shrink-0 mt-0.5 print:text-black ${isDarkMode ? 'text-slate-500' : 'text-gray-400'}`} />
                      <div>
                        <span className={`font-bold text-sm block print:text-black ${isDarkMode ? 'text-white' : 'text-gray-900'}`}>2. Dokumentation</span>
                        <span className={`text-xs mt-1 block print:text-gray-800 ${isDarkMode ? 'text-slate-400' : 'text-gray-500'}`}>Verbandbucheintrag ist Pflicht zur rechtlichen Absicherung!</span>
                      </div>
                    </li>
                    <li className="flex gap-3">
                      <Icon name="CheckCircle2" className={`w-5 h-5 flex-shrink-0 mt-0.5 print:text-black ${isDarkMode ? 'text-slate-500' : 'text-gray-400'}`} />
                      <div>
                        <span className={`font-bold text-sm block print:text-black ${isDarkMode ? 'text-white' : 'text-gray-900'}`}>3. Meldung</span>
                        <span className={`text-xs mt-1 block print:text-gray-800 ${isDarkMode ? 'text-slate-400' : 'text-gray-500'}`}>Arbeitgeber informieren. Meldepflicht bei mehr als 3 Tagen AU.</span>
                      </div>
                    </li>
                  </ul>
                  
                  <div className={`mt-6 p-4 rounded-2xl border print:hidden ${isDarkMode ? 'bg-red-950/50 border-red-900/50' : 'bg-red-50 border-red-100'}`}>
                    <p className={`text-xs font-bold leading-relaxed ${isDarkMode ? 'text-red-400' : 'text-red-800'}`}>
                      Klinik Reminder: Nadelstichverletzungen sofort bluten lassen, spülen, dokumentieren und den Betriebsarzt aufsuchen!
                    </p>
                  </div>

                  <div className="mt-6 pt-6 border-t border-gray-200 dark:border-slate-700 print:hidden">
                    <h4 className="font-bold text-sm flex items-center gap-2 mb-3">
                      <Icon name="Stethoscope" className="w-4 h-4" /> D-Arzt Vorstellung
                    </h4>
                    <p className={`text-xs mb-4 ${isDarkMode ? 'text-slate-400' : 'text-gray-600'}`}>
                      Ist der Patient über den Unfalltag hinaus arbeitsunfähig, muss er zwingend zum Durchgangsarzt. <strong>Ihr übernehmt die Erstversorgung!</strong>
                    </p>
                    <a 
                      href="https://lviweb.dguv.de/faces/arztsuche" 
                      target="_blank" 
                      rel="noopener noreferrer"
                      className="w-full flex justify-center items-center gap-2 bg-gray-900 hover:bg-gray-800 dark:bg-white dark:hover:bg-gray-200 dark:text-gray-900 text-white text-sm font-bold py-3 rounded-xl transition-colors"
                    >
                      <Icon name="Search" className="w-4 h-4" /> Offizielle D-Arzt Suche öffnen
                    </a>
                  </div>
                </div>
                
              </div>
            </div>
          </div>
        </div>
      );
    }

    // React Render Call
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
